<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6ef" />
    <meta
      name="description"
      content="Create a Stillwater account to talk about fishing locations and save your waters."
    />
    <link rel="icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Create account · Stillwater</title>
  </head>
  <body class="auth-page" data-page="register">
    <main class="auth-shell">
      <a class="auth-brand" href="/">≈ stillwater.</a>
      <section class="auth-card">
        <div class="eyebrow">STILLWATER COMMUNITY</div>
        <h1>Create your account.</h1>
        <p class="auth-intro">
          Join local conversations and sync saved waters across your devices.
        </p>
        <form class="auth-form" id="authForm">
          <label class="auth-field">
            Display name
            <input
              name="displayName"
              autocomplete="nickname"
              required
              minlength="2"
              maxlength="36"
            />
          </label>
          <label class="auth-field">
            Email
            <input name="email" type="email" autocomplete="email" required maxlength="254" />
          </label>
          <label class="auth-field">
            Password
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="128"
            />
            <small>Use at least 12 characters.</small>
          </label>
          <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Create account</button>
        </form>
        <div class="auth-links"><a href="/sign-in/">Already have an account? Sign in</a></div>
      </section>
      <p class="auth-footer"><a href="/explore/">Continue exploring without an account</a></p>
    </main>
    <script type="module" src="/js/auth-page.js"></script>
  </body>
</html>
