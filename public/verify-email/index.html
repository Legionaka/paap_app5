<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Verify email · Stillwater</title>
  </head>
  <body class="auth-page" data-page="verify-email">
    <main class="auth-shell">
      <a class="auth-brand" href="/">≈ stillwater.</a>
      <section class="auth-card">
        <div class="eyebrow">STILLWATER COMMUNITY</div>
        <h1>Confirm your email.</h1>
        <p class="auth-intro">We’re checking your verification link.</p>
        <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
        <a class="auth-submit" id="verifySignIn" href="/sign-in/" hidden>Sign in to continue</a>
      </section>
    </main>
    <script type="module" src="/js/auth-page.js"></script>
  </body>
</html>
