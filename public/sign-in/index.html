<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f5" />
    <meta name="description" content="Sign in to your Stillwater fishing community account." />
    <link rel="icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · Stillwater</title>
  </head>
  <body class="auth-page" data-page="sign-in">
    <main class="auth-shell">
      <a class="auth-brand" href="/">≈ stillwater.</a>
      <section class="auth-card">
        <div class="eyebrow">STILLWATER COMMUNITY</div>
        <h1>Welcome back.</h1>
        <p class="auth-intro">
          Sign in to join location discussions and keep your saved waters close.
        </p>
        <form class="auth-form" id="authForm">
          <label class="auth-field">
            Email
            <input name="email" type="email" autocomplete="email" required maxlength="254" />
          </label>
          <label class="auth-field">
            Password
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="128"
            />
          </label>
          <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Sign in</button>
        </form>
        <div class="auth-links">
          <a href="/forgot-password/">Forgot password?</a>
          <a id="registerLink" href="/register/">Create account</a>
        </div>
      </section>
      <p class="auth-footer"><a href="/explore/">Continue exploring without an account</a></p>
    </main>
    <script type="module" src="/js/auth-page.js"></script>
  </body>
</html>
