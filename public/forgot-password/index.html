<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reset password · Stillwater</title>
  </head>
  <body class="auth-page" data-page="forgot-password">
    <main class="auth-shell">
      <a class="auth-brand" href="/">≈ stillwater.</a>
      <section class="auth-card">
        <div class="eyebrow">ACCOUNT RECOVERY</div>
        <h1>Forgot your password?</h1>
        <p class="auth-intro">
          Enter the email address for your account. If it matches, we’ll send a reset link.
        </p>
        <form class="auth-form" id="authForm">
          <label class="auth-field">
            Email
            <input name="email" type="email" autocomplete="email" required maxlength="254" />
          </label>
          <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Send reset link</button>
        </form>
        <div class="auth-links"><a href="/sign-in/">Back to sign in</a></div>
      </section>
    </main>
    <script type="module" src="/js/auth-page.js"></script>
  </body>
</html>
